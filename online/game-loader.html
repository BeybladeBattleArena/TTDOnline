<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta id="ttd-online-game-bridge" data-mode="loader-v9">
  <meta name="ttd-build" content="release-integrity-v15">
  <title>Time To Die Online</title>
  <style>html,body{margin:0;width:100%;height:100%;background:#090b14;color:#e8e0c8;font-family:system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center}.boot{opacity:.72;font-size:13px;letter-spacing:.02em;text-align:center;padding:24px}</style>
</head>
<body>
  <div class="boot">Preparing complete cloud game and dice catalog…</div>
  <script>
    (async()=>{
      'use strict';
      const params=new URLSearchParams(location.search);
      const token=params.get('boot')||`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
      window.__TTD_BUILD_TOKEN=token;
      window.__TTD_ASSET_URL=(path)=>{
        const url=new URL(path,location.origin);
        if(url.origin===location.origin) url.searchParams.set('__ttd',token);
        return url.pathname+url.search+url.hash;
      };

      const nativeFetch=window.fetch.bind(window);
      window.fetch=(input,init={})=>{
        const raw=typeof input==='string'||input instanceof URL ? String(input) : input?.url;
        if(raw){
          const url=new URL(raw,location.href);
          if(url.origin===location.origin){
            url.searchParams.set('__ttd',token);
            return nativeFetch(url.href,{...init,cache:'no-store'});
          }
        }
        return nativeFetch(input,init);
      };

      // Final Collection authority, item presentation authorities, Overdrive battle abilities,
      // Practice Mode, and page-entry polish are injected after the transformed game document exists.
      // They are independent of the synchronous bridge chain so an earlier optional bridge error cannot
      // prevent item artwork, Rewards inventory, Overdrive content, collection transactions, training,
      // or the page-reset contract.
      let collectionAuthorityAttempts=0;
      const ensureCollectionAuthority=()=>{
        collectionAuthorityAttempts+=1;
        const ready=document.getElementById('deckScreen')&&document.getElementById('collectionGrid');
        if(ready){
          if(!document.getElementById('ttdEnchantCardArtV3Script')){
            const enchantArt=document.createElement('script');
            enchantArt.id='ttdEnchantCardArtV3Script';
            enchantArt.src=window.__TTD_ASSET_URL('/online/enchant-card-art-v1.js?v=3');
            enchantArt.async=false;
            document.head.appendChild(enchantArt);
          }
          if(!document.getElementById('ttdPipVouchersV1Script')){
            const vouchers=document.createElement('script');
            vouchers.id='ttdPipVouchersV1Script';
            vouchers.src=window.__TTD_ASSET_URL('/online/pip-vouchers-v1.js?v=1');
            vouchers.async=false;
            document.head.appendChild(vouchers);
          }
          if(!document.getElementById('ttdOverdriveSystemV1Script')){
            const overdrive=document.createElement('script');
            overdrive.id='ttdOverdriveSystemV1Script';
            overdrive.src=window.__TTD_ASSET_URL('/online/overdrive-system-v1.js');
            overdrive.async=false;
            document.head.appendChild(overdrive);
          }
          if(!document.getElementById('ttdOverdriveAbilitiesV1Script')){
            const abilities=document.createElement('script');
            abilities.id='ttdOverdriveAbilitiesV1Script';
            abilities.src=window.__TTD_ASSET_URL('/online/overdrive-abilities-v1.js');
            abilities.async=false;
            document.head.appendChild(abilities);
          }
          if(!document.getElementById('ttdOverdriveStarterPackV2Script')){
            const starterPack=document.createElement('script');
            starterPack.id='ttdOverdriveStarterPackV2Script';
            starterPack.src=window.__TTD_ASSET_URL('/online/overdrive-starter-pack-v2.js');
            starterPack.async=false;
            document.head.appendChild(starterPack);
          }
          if(!document.getElementById('ttdCollectionActionsUiV1Script')){
            const actions=document.createElement('script');
            actions.id='ttdCollectionActionsUiV1Script';
            actions.src=window.__TTD_ASSET_URL('/online/collection-actions-ui-v1.js');
            actions.async=false;
            document.head.appendChild(actions);
          }
          if(!document.getElementById('ttdCollectionAuthorityScript')){
            const authority=document.createElement('script');
            authority.id='ttdCollectionAuthorityScript';
            authority.src=window.__TTD_ASSET_URL('/online/collection-portrait-fit-v16.js');
            authority.async=false;
            document.head.appendChild(authority);
          }
          if(!document.getElementById('ttdPracticeCoreCompatV1Script')){
            const practiceCompat=document.createElement('script');
            practiceCompat.id='ttdPracticeCoreCompatV1Script';
            practiceCompat.src=window.__TTD_ASSET_URL('/online/practice-core-compat-v1.js?v=3');
            practiceCompat.async=false;
            document.head.appendChild(practiceCompat);
          }
          if(!document.getElementById('ttdPracticeModeV1Script')){
            const practice=document.createElement('script');
            practice.id='ttdPracticeModeV1Script';
            practice.src=window.__TTD_ASSET_URL('/online/practice-mode-v1.js?v=1');
            practice.async=false;
            document.head.appendChild(practice);
          }
          if(!document.getElementById('ttdPracticeRepairV2Script')){
            const practiceRepair=document.createElement('script');
            practiceRepair.id='ttdPracticeRepairV2Script';
            practiceRepair.src=window.__TTD_ASSET_URL('/online/practice-repair-v2.js?v=1');
            practiceRepair.async=false;
            document.head.appendChild(practiceRepair);
          }
          if(!document.getElementById('ttdPracticeEntryHotfixV2Script')){
            const practiceEntryHotfix=document.createElement('script');
            practiceEntryHotfix.id='ttdPracticeEntryHotfixV2Script';
            practiceEntryHotfix.src=window.__TTD_ASSET_URL('/online/practice-entry-hotfix-v2.js?v=3');
            practiceEntryHotfix.async=false;
            document.head.appendChild(practiceEntryHotfix);
          }
          if(!document.getElementById('ttdPracticeRuntimeSyncV1Script')){
            const practiceSync=document.createElement('script');
            practiceSync.id='ttdPracticeRuntimeSyncV1Script';
            practiceSync.src=window.__TTD_ASSET_URL('/online/practice-runtime-sync-v1.js?v=1');
            practiceSync.async=false;
            document.head.appendChild(practiceSync);
          }
          if(!document.getElementById('ttdPracticeLoopBridgeV1Script')){
            const practiceLoop=document.createElement('script');
            practiceLoop.id='ttdPracticeLoopBridgeV1Script';
            practiceLoop.src=window.__TTD_ASSET_URL('/online/practice-loop-bridge-v1.js?v=1');
            practiceLoop.async=false;
            document.head.appendChild(practiceLoop);
          }
          if(!document.getElementById('ttdPracticeResourceHudV1Script')){
            const practiceHud=document.createElement('script');
            practiceHud.id='ttdPracticeResourceHudV1Script';
            practiceHud.src=window.__TTD_ASSET_URL('/online/practice-resource-hud-v1.js?v=1');
            practiceHud.async=false;
            document.head.appendChild(practiceHud);
          }
          if(!document.getElementById('ttdPagePolishV32Script')){
            const polish=document.createElement('script');
            polish.id='ttdPagePolishV32Script';
            polish.src=window.__TTD_ASSET_URL('/online/page-polish-v32.js');
            polish.async=false;
            document.head.appendChild(polish);
          }
          return;
        }
        if(collectionAuthorityAttempts<200)setTimeout(ensureCollectionAuthority,25);
        else console.error('Final runtime authorities could not find the transformed game document.');
      };
      setTimeout(ensureCollectionAuthority,0);

      try{
        const manifestResponse=await nativeFetch(window.__TTD_ASSET_URL('/assets/game-assets.json'),{cache:'no-store'});
        if(!manifestResponse.ok) throw new Error(`asset manifest returned HTTP ${manifestResponse.status}`);
        const manifest=await manifestResponse.json();
        if(manifest?.schemaVersion!==1 || !manifest.assets) throw new Error('asset manifest schema is invalid');
        window.__TTD_GAME_ASSETS=Object.freeze(manifest.assets);

        const script=document.createElement('script');
        script.src=window.__TTD_ASSET_URL('/online/game-loader.js');
        script.async=false;
        document.head.appendChild(script);
      }catch(err){
        console.error('Runtime asset bootstrap failed.',err);
        document.querySelector('.boot').textContent='Could not load verified game assets. Reload and try again.';
        window.parent?.postMessage({type:'ttd:bridge-sync-error',message:`Could not start online gameplay: ${err?.message||'unknown error'}`},location.origin);
      }
    })();
  </script>
</body>
</html>
