name: Apply Moving Screen presentation parity

on:
  push:
    branches:
      - feature/moving-screen-presentation-parity-v1
    paths:
      - .github/workflows/apply-moving-screen-presentation-parity.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct current single-player controls cache anchor
        shell: bash
        run: |
          sed -i 's#("/online/singleplayer-run-controls-v1.js?v=1","/online/singleplayer-run-controls-v1.js?v=2")#("/online/singleplayer-run-controls-v1.js?v=2","/online/singleplayer-run-controls-v1.js?v=3")#' scripts/apply-moving-screen-presentation-parity.py
      - name: Apply presentation parity repair
        run: python scripts/apply-moving-screen-presentation-parity.py
      - name: Align presentation validators
        shell: bash
        run: |
          python scripts/align-moving-screen-presentation-validators.py
          find scripts -name '*.mjs' -exec sed -i 's#/online/singleplayer-run-controls-v1.js?v=2#/online/singleplayer-run-controls-v1.js?v=3#g' {} +
      - name: Install dependencies
        run: |
          npm install
          npm --prefix functions install
      - name: Validate full hosting client
        run: npm run check:hosting
      - name: Commit verified source repair
        shell: bash
        run: |
          git config user.name "BeybladeBattleArena"
          git config user.email "stepmaniaredditrequests@gmail.com"
          git add online package.json random-dice-game-33.html scripts
          git diff --cached --check
          git commit -m "Align Moving Screen with shared single-player presentation"
          git push origin HEAD:feature/moving-screen-presentation-parity-v1
