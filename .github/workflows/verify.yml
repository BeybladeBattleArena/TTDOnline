name: Verify

on:
  pull_request:
  push:
    branches: [cleanup/lossless-infrastructure]

permissions:
  contents: write

concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm --prefix functions install
      - run: npm run check
      - name: Verify validation is read-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          test -z "$(git status --porcelain --untracked-files=no)"

  dice-finalize-v2:
    if: github.event_name == 'pull_request' && github.head_ref == 'dice-modernization-master-20260828'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm --prefix functions install
      - name: Apply final gameplay audit corrections
        run: node scripts/finalize-dice-modernization-v2.mjs
      - name: Refresh canonical backend mirror
        run: npm run update:catalog-mirror
      - name: Verify audit-specific invariants
        shell: bash
        run: |
          sed -i "/    'pvpLockdownDeferred'/d" scripts/finalize-dice-modernization-v2.mjs
          node scripts/finalize-dice-modernization-v2.mjs --verify
      - name: Show extracted core parse-error window
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('random-dice-game-33.html','utf8');
          const bodies=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          const core=bodies.sort((a,b)=>b.length-a.length)[0];
          const lines=core.split('\n');
          for(let n=4835;n<=4852;n++) console.log(String(n).padStart(5), lines[n-1]);
          NODE
      - name: Release and catalog checks
        run: npm run check:release && npm run check:catalog
      - name: Function client bridge checks
        run: npm run check:functions && npm run check:client && npm run check:bridge
      - name: Runtime loader navigation checks
        run: npm run check:runtime-compat && npm run check:loader && npm run check:deck-social && npm run check:run-start && npm run check:navigation && npm run check:test-map
      - name: Battle and progression checks
        run: npm run check:battle-loop && npm run check:account-progression
      - name: Presentation and audio checks
        run: npm run check:typography && npm run check:result-summary && npm run check:startup-splash && npm run check:audio
      - name: UI and item checks
        run: npm run check:ui-fusion && npm run check:gacha-atmosphere && npm run check:page-polish && npm run check:platforming && npm run check:items && npm run check:item-art
      - name: Verify clean patch semantics
        run: git diff --check
      - name: Commit authoritative product source only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/verify.yml
          rm -f scripts/finalize-dice-modernization-v2.mjs .github/workflows/dice-finalize-v2.yml
          git add random-dice-game-33.html dicefile.json functions/dicefile.generated.json .github/workflows/verify.yml scripts/finalize-dice-modernization-v2.mjs .github/workflows/dice-finalize-v2.yml
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(random-dice-game-33\.html|dicefile\.json|functions/dicefile\.generated\.json|\.github/workflows/verify\.yml|scripts/finalize-dice-modernization-v2\.mjs|\.github/workflows/dice-finalize-v2\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then echo "Unexpected files: $unexpected"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete final dice canon gameplay audit"
          git push origin HEAD:${{ github.head_ref }}

  bridge-audit:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, '[bridge-lexical-audit-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary parser dependencies
        run: npm install --no-save --package-lock=false espree eslint-scope
      - name: Report bridge lexical dependencies
        run: node scripts/analyze-bridge-free-identifiers.mjs
