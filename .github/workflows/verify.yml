name: Verify

on:
  pull_request:
  push:
    branches: [cleanup/lossless-infrastructure]

permissions:
  contents: write

concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm --prefix functions install
      - run: npm run check
      - name: Verify validation is read-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          test -z "$(git status --porcelain --untracked-files=no)"

  dice-finalize-v2:
    if: github.event_name == 'pull_request' && github.head_ref == 'dice-modernization-master-20260828'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm --prefix functions install
      - name: Apply final gameplay audit corrections
        run: node scripts/finalize-dice-modernization-v2.mjs
      - name: Refresh canonical backend mirror
        run: npm run update:catalog-mirror
      - name: Verify audit-specific invariants
        shell: bash
        run: |
          sed -i "/    'pvpLockdownDeferred'/d" scripts/finalize-dice-modernization-v2.mjs
          node scripts/finalize-dice-modernization-v2.mjs --verify
      - name: Release and catalog checks
        continue-on-error: true
        run: npm run check:release && npm run check:catalog
      - name: Function client bridge checks
        continue-on-error: true
        run: npm run check:functions && npm run check:client && npm run check:bridge
      - name: Runtime loader navigation checks
        continue-on-error: true
        run: npm run check:runtime-compat && npm run check:loader && npm run check:deck-social && npm run check:run-start && npm run check:navigation && npm run check:test-map
      - name: Battle and progression checks
        continue-on-error: true
        run: npm run check:battle-loop && npm run check:account-progression
      - name: Presentation and audio checks
        continue-on-error: true
        run: npm run check:typography && npm run check:result-summary && npm run check:startup-splash && npm run check:audio
      - name: UI and item checks
        continue-on-error: true
        run: npm run check:ui-fusion && npm run check:gacha-atmosphere && npm run check:page-polish && npm run check:platforming && npm run check:items && npm run check:item-art
      - name: Diagnostic stop
        run: exit 1

  bridge-audit:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, '[bridge-lexical-audit-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary parser dependencies
        run: npm install --no-save --package-lock=false espree eslint-scope
      - name: Report bridge lexical dependencies
        run: node scripts/analyze-bridge-free-identifiers.mjs
