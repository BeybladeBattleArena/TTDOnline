name: Verify

on:
  pull_request:
  push:
    branches: [cleanup/lossless-infrastructure]

permissions:
  contents: write

concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  modernize-dice:
    if: github.event_name == 'pull_request' && github.head_ref == 'dice-modernization-master-20260828'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm --prefix functions install
      - name: Apply 2026-08-28 master canon natively
        run: |
          node scripts/apply-dice-modernization-catalog-20260828.mjs
          node scripts/apply-dice-modernization-source-20260828.mjs
      - name: Validate complete repository after modernization
        run: npm run check
      - name: Verify clean patch semantics
        run: git diff --check
      - name: Commit authoritative source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/verify.yml
          git rm -f scripts/apply-dice-modernization-catalog-20260828.mjs scripts/apply-dice-modernization-source-20260828.mjs .github/workflows/apply-dice-modernization-20260828.yml
          git add random-dice-game-33.html dicefile.json functions/dicefile.generated.json .github/workflows/verify.yml
          git commit -m "feat: modernize dice roster from 2026-08-28 master canon"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm --prefix functions install
      - run: npm run check
      - name: Verify validation is read-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo 'Validation changed tracked source.'
            git status --short
            exit 1
          fi
          echo 'Validation completed without changing tracked source.'

  bridge-audit:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, '[bridge-lexical-audit-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary parser dependencies
        run: npm install --no-save --package-lock=false espree eslint-scope
      - name: Report bridge lexical dependencies
        run: node scripts/analyze-bridge-free-identifiers.mjs
