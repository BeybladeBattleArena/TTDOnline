name: Verify

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm --prefix functions install
      - run: npm run check
