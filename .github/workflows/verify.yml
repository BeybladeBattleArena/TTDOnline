name: Verify

on:
  pull_request:
  push:
    branches: [cleanup/lossless-infrastructure]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  canon-completion-materialize:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'dice-modernization-canon-completion-')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize canon completion
        run: node scripts/apply-canon-completion-20260828.mjs
      - name: Validate syntax and patch semantics
        run: |
          node --check scripts/apply-canon-completion-20260828.mjs
          git diff --check
      - name: Commit materialized canonical source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- random-dice-game-33.html; then
            echo 'Canonical source is already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add random-dice-game-33.html
          git commit -m 'feat: materialize dice canon mechanics and presentation'
          git push origin HEAD:${{ github.head_ref }}

  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm --prefix functions install
      - run: npm run check
      - name: Verify validation is read-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo 'Validation changed tracked source.'
            git status --short
            exit 1
          fi
          echo 'Validation completed without changing tracked source.'

  bridge-audit:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, '[bridge-lexical-audit-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary parser dependencies
        run: npm install --no-save --package-lock=false espree eslint-scope
      - name: Report bridge lexical dependencies
        run: node scripts/analyze-bridge-free-identifiers.mjs
