name: Verify

on:
  pull_request:

permissions:
  contents: read

# Development branches are assembled before a PR is opened. If a PR is updated,
# only the newest complete candidate matters; stale verification runs are cancelled.
concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm --prefix functions install
      - run: npm run check
