name: One-time Black Taurus materialization

on:
  push:
    branches: [feature/black-taurus-v1]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'Run Black Taurus materializer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize Black Taurus
        run: python3 scripts/materialize-black-taurus-v1.py
      - name: Install validation toolchain
        run: npm install
      - name: Validate Black Taurus, backend, and deployable client
        shell: bash
        run: |
          set -euo pipefail
          node --check online/overdrive-abilities-v1.js
          node --check functions/gift-v7-secure.js
          npm run check:overdrive
          npm run check:backend
          npm run check:hosting
          git diff --check
      - name: Commit validated release source
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/materialize-black-taurus-v1.py .github/workflows/materialize-black-taurus-once.yml
          git config user.name 'BeybladeBattleArena'
          git config user.email 'stepmaniaredditrequests@gmail.com'
          git add -A
          git diff --cached --quiet && { echo 'No Black Taurus source changes were produced.'; exit 1; }
          git commit -m '[release] Add Black Taurus'
          git push origin HEAD:feature/black-taurus-v1
