name: Temporary fix document-ready loader
on:
  push:
    branches:
      - agent/fix-document-ready-loader
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-document-ready-loader
      - name: Remove loader-scope dependency from bridge catch
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('online/game-loader.js')
          s=p.read_text()
          old="  send('ttd:bridge-phase',{phase:'bridge-runtime-error',bridge:${bridgeLiteral},message:String(__ttdBridgeErr?.message||__ttdBridgeErr)});"
          new="  try { window.parent?.postMessage({type:'ttd:bridge-phase',phase:'bridge-runtime-error',bridge:${bridgeLiteral},message:String(__ttdBridgeErr?.message||__ttdBridgeErr)}, location.origin); } catch (_) {}"
          if old not in s: raise SystemExit('bridge runtime reporting marker missing')
          p.write_text(s.replace(old,new,1))

          p=Path('scripts/check-deck-social-v18.mjs')
          s=p.read_text()
          old="""const isolationContext={\n  console:{error(){}},\n  send(){},\n  BRIDGES:['synthetic-first-bridge','synthetic-deck-editor'],\n  sources:[\"(()=>{throw new Error('synthetic bridge failure');})();\",\"globalThis.__deckEditorSurvived=true;\"],\n};"""
          new="""const isolationContext={\n  console:{error(){}},\n  window:{parent:{postMessage(){}}},\n  location:{origin:'https://example.invalid'},\n  BRIDGES:['synthetic-first-bridge','synthetic-deck-editor'],\n  sources:[\"(()=>{throw new Error('synthetic bridge failure');})();\",\"globalThis.__deckEditorSurvived=true;\"],\n};"""
          if old not in s: raise SystemExit('synthetic isolation context marker missing')
          s=s.replace(old,new,1)
          anchor="requireMarkers(loader,['const isolatedSources=sources.map','failed without blocking later bridges.','bridge-runtime-error'],'bridge isolation');\n"
          addition="if(loader.slice(loader.indexOf('const isolatedSources=sources.map'),loader.indexOf('transformed=transformed.slice',loader.indexOf('const isolatedSources=sources.map'))).includes(\"send('ttd:bridge-phase'\"))throw new Error('Bridge isolation catch may not depend on the loader-scope send() helper.');\n"
          if addition not in s:
              if anchor not in s: raise SystemExit('bridge isolation assertion marker missing')
              s=s.replace(anchor,anchor+addition,1)
          p.write_text(s)

          p=Path('scripts/check-online-loader-v15.mjs')
          s=p.read_text()
          marker="if(!loader.includes('const isolatedSources=sources.map') || !loader.includes('failed without blocking later bridges.')) throw new Error('Injected online bridges are not runtime-isolated; one bridge could block later bridges such as Deck Editor.');"
          addition="\nconst isolationBlock=loader.slice(loader.indexOf('const isolatedSources=sources.map'),loader.indexOf('transformed=transformed.slice',loader.indexOf('const isolatedSources=sources.map')));\nif(isolationBlock.includes(\"send('ttd:bridge-phase'\")) throw new Error('Bridge runtime isolation incorrectly depends on loader-scope send() after document.write.');\nif(!isolationBlock.includes('window.parent?.postMessage')) throw new Error('Bridge runtime isolation does not use document-scope-safe error reporting.');"
          if marker not in s: raise SystemExit('online loader isolation marker missing')
          if addition.strip() not in s: s=s.replace(marker,marker+addition,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add online/game-loader.js scripts/check-deck-social-v18.mjs scripts/check-online-loader-v15.mjs
          git commit -m 'Fix bridge isolation after document write'
          git push origin HEAD:agent/fix-document-ready-loader
