name: Repair Moving Screen repair workflow

on:
  push:
    branches:
      - feature/moving-screen-mobile-smoothness-fix-v1
    paths:
      - .github/workflows/repair-moving-screen-repair-workflow.yml

permissions:
  contents: write

jobs:
  repair-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove unavailable npm cache assumption
        run: |
          sed -i '/^[[:space:]]*cache: npm$/d' .github/workflows/fix-moving-screen-mobile-smoothness.yml
          sed -i 's/run: npm ci/run: npm install/' .github/workflows/fix-moving-screen-mobile-smoothness.yml
      - name: Commit workflow repair
        run: |
          git config user.name "BeybladeBattleArena"
          git config user.email "stepmaniaredditrequests@gmail.com"
          git rm .github/workflows/repair-moving-screen-repair-workflow.yml
          git add .github/workflows/fix-moving-screen-mobile-smoothness.yml
          git commit -m "Repair Moving Screen validation runner"
          git push origin HEAD:feature/moving-screen-mobile-smoothness-fix-v1
