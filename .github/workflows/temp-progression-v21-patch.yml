name: Temporary progression v21 patcher
on:
  push:
    branches:
      - agent/account-progression-v21
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/account-progression-v21
      - run: python .asset-staging/patch-progression-v21.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/singleplayer-v6.js functions/deck-social-v18.js online/deck-social-client-v18.js online/game-loader.js scripts/check-online-loader-v15.mjs scripts/check-deck-social-v18.mjs
          git commit -m 'Integrate account progression v21' || exit 0
          git push origin HEAD:agent/account-progression-v21
