name: Provision C7 Vault Once

on:
  push:
    branches: [gift-code-all-c7-20260828]
    paths:
      - '.github/workflows/provision-c7-vault-once.yml'

permissions:
  contents: write
  id-token: write

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gift-code-all-c7-20260828

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply gift capacity patch
        run: node scripts/patch-c7-gift-cap.mjs

      - name: Install validation dependencies
        run: |
          npm install
          npm --prefix functions install

      - name: Validate complete product tree
        run: npm run check

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ttd-online-b8c0f
          workload_identity_provider: projects/761371312112/locations/global/workloadIdentityPools/github-actions/providers/ttd-online
          service_account: github-firebase-deployer@ttd-online-b8c0f.iam.gserviceaccount.com

      - name: Provision hashed one-use C7 vault
        run: node functions/seed-c7-vault-once.js

      - name: Commit validated permanent product changes only
        run: |
          git config user.name "BeybladeBattleArena"
          git config user.email "stepmaniaredditrequests@gmail.com"
          git add functions/singleplayer-v6.js scripts/check-v6-canonical-snapshot-v1.mjs
          git diff --cached --quiet && exit 0
          git commit -m "feat: support complete-catalog gift rewards"
          git push origin HEAD:gift-code-all-c7-20260828
