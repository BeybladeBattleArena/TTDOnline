name: One-time Traversal Continuity Materialization

on:
  push:
    branches: [cleanup/lossless-infrastructure]

permissions:
  contents: read

concurrency:
  group: ttd-temporary-runtime-audit
  cancel-in-progress: false

jobs:
  bridge-audit:
    if: startsWith(github.event.head_commit.message, '[bridge-lexical-audit-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary parser dependencies
        run: npm install --no-save --package-lock=false espree eslint-scope
      - name: Report bridge lexical dependencies
        run: node scripts/analyze-bridge-free-identifiers.mjs
