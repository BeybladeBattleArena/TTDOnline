name: Extract Dark Monastery V2 Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-dark-monastery-v2.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract readable Dark Monastery runtime
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const src = fs.readFileSync('online/dark-monastery-adventure-v2.js','utf8');
          const m = src.match(/const payload\s*=([\s\S]*?);\s*window\.__TTD_DARK_MONASTERY_V2_READY/);
          if(!m) throw new Error('payload expression not found');
          const payload = Function(`"use strict"; return (${m[1]});`)();
          const readable = zlib.gunzipSync(Buffer.from(payload,'base64')).toString('utf8');
          fs.writeFileSync('dark-monastery-adventure-v2-source.js', readable);
          console.log(`Extracted ${readable.length} bytes`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: dark-monastery-v2-source
          path: dark-monastery-adventure-v2-source.js
          if-no-files-found: error
