name: Magma Force Build

on:
  push:
    branches: [feature/magma-force]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/magma-force
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply, validate, and publish tested candidate
        shell: bash
        run: |
          set +e
          LOG=magma-force-build.log
          : > "$LOG"
          (
            set -euo pipefail
            echo '=== correct patcher assertions from dry runs ==='
            python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-magma-force-v1.py')
          s=p.read_text()
          old='    text = replace_once(text, "\'/online/dice-catalog-bridge-v7.js?v=7\'", "\'/online/dice-catalog-bridge-v8.js?v=8\'", \'catalog bridge URL\')'
          new='    text = text.replace("\'/online/dice-catalog-bridge-v7.js?v=7\'", "\'/online/dice-catalog-bridge-v8.js?v=8\'")'
          if old not in s:
              raise SystemExit('Could not locate first-run catalog URL assertion in patcher.')
          s=s.replace(old,new,1)
          s=s.replace("text = text.replace('/online/dice-catalog-bridge-v7.js?v=7', '/online/dice-catalog-bridge-v8.js?v=8')", "text = text.replace('/online/dice-catalog-bridge-v8.js?v=7', '/online/dice-catalog-bridge-v8.js?v=8')")
          p.write_text(s)
          PY
            echo '=== apply Magma Force patch ==='
            python3 scripts/apply-magma-force-v1.py
            echo '=== extend first-frame battle-loop regression guard ==='
            python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/check-battle-loop-v20.mjs')
          s=p.read_text()
          s=s.replace("const soul=fs.readFileSync('online/dice-catalog-bridge-v7.js','utf8');", "const soul=fs.readFileSync('online/dice-catalog-bridge-v8.js','utf8');")
          s=s.replace("  '__TTD_BATTLE_HOOKS.fireSoulScimitar',", "  '__TTD_BATTLE_HOOKS.fireMagmaForce',\n  '__TTD_BATTLE_HOOKS.fireSoulScimitar',")
          s=s.replace("  '__TTD_BATTLE_HOOKS.updateSoulScimitars(dt)',", "  '__TTD_BATTLE_HOOKS.updateMagmaForce(dt)',\n  '__TTD_BATTLE_HOOKS.updateSoulScimitars(dt)',")
          s=s.replace("  '__TTD_BATTLE_HOOKS.drawSoulScimitars()',", "  '__TTD_BATTLE_HOOKS.drawSoulScimitars()',\n  '__TTD_BATTLE_HOOKS.drawMagmaForceGround()',\n  '__TTD_BATTLE_HOOKS.drawMagmaForceOverlay()',")
          s=s.replace("  'Object.assign(__TTD_BATTLE_HOOKS,{fireSoulScimitar,updateSoulScimitars,drawSoulScimitars})',", "  'Object.assign(__TTD_BATTLE_HOOKS,{fireMagmaForce,updateMagmaForce,drawMagmaForceGround,drawMagmaForceOverlay,fireSoulScimitar,updateSoulScimitars,drawSoulScimitars})',")
          s=s.replace("need(soul,['function fireSoulScimitar(','function updateSoulScimitars(','function drawSoulScimitars('],'Soul combat bridge');", "need(soul,['function fireMagmaForce(','function updateMagmaForce(','function drawMagmaForceGround(','function drawMagmaForceOverlay(','function fireSoulScimitar(','function updateSoulScimitars(','function drawSoulScimitars('],'Catalog combat bridge');")
          s=s.replace("Battle loop v20 verified: strict-mode bridge isolation cannot hide Soul/Slither hooks from the first animation frame", "Battle loop v20 verified: strict-mode bridge isolation cannot hide Magma/Soul/Slither hooks from the first animation frame")
          p.write_text(s)
          PY
            echo '=== install root dependencies ==='
            npm install
            echo '=== install function dependencies ==='
            npm --prefix functions install
            echo '=== full repository verification ==='
            npm run check
            echo '=== focused Magma Force assertions ==='
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog=JSON.parse(fs.readFileSync('dicefile.json','utf8'));
          const m=catalog.dice.magmaforce;
          if(!m) throw new Error('Magma Force missing from canonical catalog.');
          if(m.special.kind!=='magmaForce'||m.special.baseBoulderCount!==4||m.special.class4BoulderCount!==5) throw new Error('Magma Force class-count contract failed.');
          if(m.atk!==7.2||m.category!=='physical'||m.affinities.earth!==0.5||m.affinities.fire!==0.5) throw new Error('Magma Force cooldown/category/affinity contract failed.');
          const bridge=fs.readFileSync('online/dice-catalog-bridge-v8.js','utf8');
          for(const marker of ['function fireMagmaForce','function updateMagmaForce','function drawMagmaForceGround','function drawMagmaForceOverlay','avgLen*4 + boulderR*2']) if(!bridge.includes(marker)) throw new Error('Missing Magma Force runtime marker: '+marker);
          const loader=fs.readFileSync('online/game-loader.js','utf8');
          for(const marker of ["case 'magmaForce'",'__TTD_BATTLE_HOOKS.updateMagmaForce(dt)','drawMagmaForceGround','drawMagmaForceOverlay']) if(!loader.includes(marker)) throw new Error('Missing Magma Force loader marker: '+marker);
          console.log('Focused Magma Force assertions passed.');
          NODE
          ) >> "$LOG" 2>&1
          status=$?

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$status" -ne 0 ]; then
            cp "$LOG" magma-force-build-failure.txt
            git add magma-force-build-failure.txt
            git commit -m 'chore: record Magma Force build failure' || true
            git push origin HEAD:feature/magma-force || true
            cat "$LOG"
            exit "$status"
          fi

          rm -f magma-force-build-failure.txt magma-inspect.txt "$LOG"
          rm -f scripts/apply-magma-force-v1.py .github/workflows/magma-force-inspect.yml
          git add -A
          git commit -m '[release] Add Magma Force die'
          git push origin HEAD:feature/magma-force
