name: Temporary fix bridge isolation scope
on:
  push:
    branches:
      - agent/deck-bridge-isolation
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deck-bridge-isolation
      - name: Bake bridge name into isolation wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('online/game-loader.js')
          s=p.read_text()
          old="""    const isolatedSources=sources.map((source,index)=>`\\ntry {\\n${source}\\n} catch (__ttdBridgeErr) {\\n  console.error('Online bridge '+BRIDGES[index]+' failed without blocking later bridges.',__ttdBridgeErr);\\n  send('ttd:bridge-phase',{phase:'bridge-runtime-error',bridge:BRIDGES[index],message:String(__ttdBridgeErr?.message||__ttdBridgeErr)});\\n}\\n`);"""
          new="""    const isolatedSources=sources.map((source,index)=>{\n      const bridgeLiteral=JSON.stringify(BRIDGES[index]);\n      return `\\ntry {\\n${source}\\n} catch (__ttdBridgeErr) {\\n  console.error('Online bridge '+${bridgeLiteral}+' failed without blocking later bridges.',__ttdBridgeErr);\\n  send('ttd:bridge-phase',{phase:'bridge-runtime-error',bridge:${bridgeLiteral},message:String(__ttdBridgeErr?.message||__ttdBridgeErr)});\\n}\\n`;\n    });"""
          if old not in s: raise SystemExit('current isolation wrapper marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add online/game-loader.js
          git commit -m 'Bake bridge identity into isolated runtime wrappers'
          git push origin HEAD:agent/deck-bridge-isolation
