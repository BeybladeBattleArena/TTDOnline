name: One-time Post-cleanup Behavior Recovery

on:
  push:
    branches: [fix/post-cleanup-regressions]

permissions:
  contents: write

concurrency:
  group: post-cleanup-behavior-recovery-v1
  cancel-in-progress: false

jobs:
  recover:
    if: startsWith(github.event.head_commit.message, '[behavior-recovery-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-cleanup-regressions
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify migration script syntax
        run: node --check scripts/apply-post-cleanup-behavior-recovery-v1.mjs

      - name: Materialize behavior recovery
        run: node scripts/apply-post-cleanup-behavior-recovery-v1.mjs

      - name: Enforce recovery scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          [[ -n "$changed" ]] || { echo 'Behavior recovery produced no changes.'; exit 1; }
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(online/avatar-inventory-v22\.js|online/run-ui-bridge-v21\.js)$' || true)"
          [[ -z "$unexpected" ]] || {
            echo "Behavior recovery changed an unexpected scope:"
            printf '%s\n' "$unexpected"
            exit 1
          }

      - name: Install validation toolchain
        run: npm install

      - name: Install Functions dependencies
        run: npm --prefix functions install

      - name: Validate complete repository
        run: npm run check

      - name: Reverify immutable masters
        run: npm run check:immutable-assets

      - name: Commit recovered behavior
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online/avatar-inventory-v22.js online/run-ui-bridge-v21.js
          git commit -m "fix: complete approved item art routing [skip behavior-recovery-v1]"
          git push origin HEAD:fix/post-cleanup-regressions
