name: One-time Post-recovery Results and Resale

on:
  push:
    branches: [fix/post-recovery-results-audio-resale]

permissions:
  contents: write

concurrency:
  group: post-recovery-results-resale-v3
  cancel-in-progress: false

jobs:
  materialize:
    if: startsWith(github.event.head_commit.message, '[results-resale-v3]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-recovery-results-audio-resale
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify materializer syntax
        run: |
          node --check scripts/apply-post-recovery-game-v3.mjs
          node --check scripts/apply-post-recovery-world-v3.mjs
      - name: Materialize canonical runtime changes
        run: |
          node scripts/apply-post-recovery-game-v3.mjs
          node scripts/apply-post-recovery-world-v3.mjs
      - name: Enforce materialization scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' online/world-items-v1.js random-dice-game-33.html | sort)"
          [[ "$changed" == "$expected" ]] || { echo "Unexpected materialized scope:"; printf '%s\n' "$changed"; exit 1; }
      - name: Install validation toolchain
        run: npm install
      - name: Install Functions dependencies
        run: npm --prefix functions install
      - name: Validate complete repository
        run: npm run check
      - name: Reverify immutable masters
        run: npm run check:immutable-assets
      - name: Commit materialized runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online/world-items-v1.js random-dice-game-33.html
          git commit -m "feat: restore verified Zombie EXP and resale rules [skip results-resale-v3]"
          git push origin HEAD:fix/post-recovery-results-audio-resale
