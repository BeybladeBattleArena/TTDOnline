name: One-time Post-recovery Results and Resale

on:
  push:
    branches: [fix/post-recovery-results-audio-resale]

permissions:
  contents: write

concurrency:
  group: post-recovery-results-resale-v4
  cancel-in-progress: false

jobs:
  materialize:
    if: startsWith(github.event.head_commit.message, '[results-resale-v4]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-recovery-results-audio-resale
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify materializer syntax
        run: node --check scripts/apply-post-recovery-shop-currency-v1.mjs
      - name: Materialize canonical runtime change
        run: node scripts/apply-post-recovery-shop-currency-v1.mjs
      - name: Enforce materialization scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          [[ "$changed" == "random-dice-game-33.html" ]] || { echo "Unexpected materialized scope:"; printf '%s\n' "$changed"; exit 1; }
      - name: Install validation toolchain
        run: npm install
      - name: Install Functions dependencies
        run: npm --prefix functions install
      - name: Validate complete repository
        run: npm run check
      - name: Reverify immutable masters
        run: npm run check:immutable-assets
      - name: Commit materialized runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add random-dice-game-33.html
          git commit -m "feat: make Shop purchase currency and resale provenance authoritative [skip results-resale-v4]"
          git push origin HEAD:fix/post-recovery-results-audio-resale
