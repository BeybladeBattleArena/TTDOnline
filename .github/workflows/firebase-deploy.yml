name: Firebase Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, agent/firebase-foundation]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ttd-online-b8c0f
          workload_identity_provider: projects/761371312112/locations/global/workloadIdentityPools/github-actions/providers/ttd-online
          service_account: github-firebase-deployer@ttd-online-b8c0f.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install
      - run: npm --prefix functions install
      - run: npm run check
      - run: npx firebase-tools deploy --project ttd-online-b8c0f --non-interactive --force
