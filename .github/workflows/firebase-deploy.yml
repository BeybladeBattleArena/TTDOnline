name: Firebase Hosting Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ttd-online-b8c0f
          workload_identity_provider: projects/761371312112/locations/global/workloadIdentityPools/github-actions/providers/ttd-online
          service_account: github-firebase-deployer@ttd-online-b8c0f.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install hosting toolchain
        run: npm install

      - name: Validate deployable game client
        run: npm run check:hosting

      - name: Stamp exact production build
        run: |
          printf '{"commit":"%s","ref":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > build.json

      - name: Deploy Hosting
        run: npx firebase-tools deploy --only hosting --project ttd-online-b8c0f --non-interactive --force

      - name: Verify exact commit is live
        env:
          LIVE_URL: https://ttd-online-b8c0f.web.app
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            body="$(curl -fsS -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/build.json?verify=$GITHUB_SHA-$attempt" || true)"
            if [[ "$body" == *"\"commit\":\"$GITHUB_SHA\""* ]]; then
              echo "Verified production Hosting commit $GITHUB_SHA"
              exit 0
            fi
            sleep 2
          done
          echo "Production verification failed: Hosting is not serving $GITHUB_SHA"
          exit 1

      - name: Verify critical game and high-resolution art
        env:
          LIVE_URL: https://ttd-online-b8c0f.web.app
        run: |
          set -euo pipefail
          check_file() {
            local path="$1"
            local min_bytes="$2"
            local tmp
            tmp="$(mktemp)"
            curl -fsS -H 'Cache-Control: no-cache, no-store' "$LIVE_URL$path?verify=$GITHUB_SHA" -o "$tmp"
            local bytes
            bytes="$(wc -c < "$tmp" | tr -d ' ')"
            rm -f "$tmp"
            if [ "$bytes" -lt "$min_bytes" ]; then
              echo "Production asset $path is unexpectedly small: $bytes bytes"
              exit 1
            fi
            echo "Verified $path ($bytes bytes)"
          }
          check_file /online.html 1000
          check_file /online/startup-gate-v33.js 1000
          check_file /assets/game-assets.json 1000
          check_file /assets/ui/loading-endless-horde.jpg 100000
          check_file /assets/ui/loading-al-hata.jpg 100000
          check_file /assets/items/mystery-chest.jpg 100000
          check_file /assets/items/epic-summon-ticket.jpg 100000
          check_file /assets/items/exp-tome.jpg 100000
          check_file /assets/items/key-normal.jpg 100000
          check_file /assets/items/key-hard.jpg 100000
          check_file /assets/items/key-hell.jpg 100000

      - name: Record verified production commit
        shell: bash
        run: |
          printf '{"commit":"%s","verifiedAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > production-verified.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-verified.json
          git commit -m "[skip ci] [deployment-record] verified production $GITHUB_SHA"
          git push origin HEAD:main
