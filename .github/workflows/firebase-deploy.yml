name: Firebase Hosting Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin exact source commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "main" ]] || { echo "Production deploys must run from main, not $GITHUB_REF_NAME"; exit 1; }
          checked_out="$(git rev-parse HEAD)"
          [[ "$checked_out" == "$GITHUB_SHA" ]] || { echo "Checked out $checked_out but workflow requested $GITHUB_SHA"; exit 1; }
          echo "DEPLOY_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "Pinned production candidate $GITHUB_SHA"

      - name: Install hosting toolchain
        id: install
        run: npm install

      - name: Validate deployable game client
        id: validate
        run: npm run check:hosting

      - name: Verify source tree is unchanged
        id: clean_source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo 'Validation changed tracked source. Deployment is forbidden.'
            git status --short
            exit 1
          fi
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_SHA" ]] || { echo 'HEAD changed during validation.'; exit 1; }
          echo "Validated source remains exactly $DEPLOY_SHA"

      - name: Authenticate to Google Cloud
        id: gcp_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ttd-online-b8c0f
          workload_identity_provider: projects/761371312112/locations/global/workloadIdentityPools/github-actions/providers/ttd-online
          service_account: github-firebase-deployer@ttd-online-b8c0f.iam.gserviceaccount.com

      - name: Stamp exact production build
        id: stamp
        run: |
          printf '{"commit":"%s","ref":"%s","builtAt":"%s"}\n' "$DEPLOY_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > build.json

      - name: Deploy Hosting
        id: hosting_deploy
        run: npx firebase-tools deploy --only hosting --project ttd-online-b8c0f --non-interactive --force

      - name: Verify exact commit is live
        id: live_verify
        env:
          LIVE_URL: https://ttd-online-b8c0f.web.app
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            body="$(curl -fsS -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/build.json?verify=$DEPLOY_SHA-$attempt" || true)"
            if [[ "$body" == *"\"commit\":\"$DEPLOY_SHA\""* ]]; then
              echo "Verified production Hosting commit $DEPLOY_SHA"
              exit 0
            fi
            sleep 2
          done
          echo "Production verification failed: Hosting is not serving $DEPLOY_SHA"
          exit 1

      - name: Verify critical game, original audio, and transparent PNG art
        id: smoke_verify
        env:
          LIVE_URL: https://ttd-online-b8c0f.web.app
        run: bash scripts/smoke-hosting-png-v34.sh

      - name: Summarize verified production deployment
        if: success()
        shell: bash
        run: |
          {
            echo '### TTD production deployment verified'
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo '- Source mutation: none'
            echo '- Live build identity: verified'
            echo '- Critical asset smoke test: passed'
          } >> "$GITHUB_STEP_SUMMARY"
