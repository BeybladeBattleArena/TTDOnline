name: Pip Voucher Exact Asset Import

on:
  push:
    branches: [feature/pip-voucher-items-v1]
    paths:
      - '.github/workflows/pip-voucher-asset-import.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pip-voucher-items-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Register exact voucher masters and release gates
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const amounts=[1000,5000,10000,20000,40000,60000,80000,100000];
          const blob={
            1000:'e00b9f0fefcc39d7eb525ebdca555626534e7da1',
            5000:'e448ba10efe9d121cea51e893d4c410338c663ff',
            10000:'229efc1571670e743f760c1156041e2d51df5a52',
            20000:'0a4f3422ba908a2f4ea3329ec0cf09c881c14a8d',
            40000:'11dcaf35677a27f90e738417f3852c06e899c1ef',
            60000:'72383d482373782916e4806da1c10b8be902b701',
            80000:'6eebe4fabae69590a20702bfeb1798f46de1fb86',
            100000:'231a82a9c5af9d101cfc88f921da7facb7ecc48f',
          };
          const game=JSON.parse(fs.readFileSync('assets/game-assets.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('assets/immutable-assets.lock.json','utf8'));
          for(const amount of amounts){
            const rel=`assets/items/pip-voucher-${amount}.png`;
            game.assets[`itemPipVoucher${amount}`]={path:`/${rel}`,format:'image/png',width:1536,height:658,usage:{inventory:{box:[132,72],fit:'contain'},detail:{box:[238,104],fit:'contain'}}};
            lock.assets[rel]=blob[amount];
          }
          fs.writeFileSync('assets/game-assets.json',JSON.stringify(game,null,2)+'\n');
          fs.writeFileSync('assets/immutable-assets.lock.json',JSON.stringify(lock,null,2)+'\n');

          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.scripts['check:pip-vouchers']='node scripts/check-pip-vouchers-v1.mjs';
          for(const key of ['check','check:hosting'])if(!pkg.scripts[key].includes('npm run check:pip-vouchers'))pkg.scripts[key]+=' && npm run check:pip-vouchers';
          if(!pkg.scripts['check:bridge'].includes('node --check online/pip-vouchers-v1.js'))pkg.scripts['check:bridge']+=' && node --check online/pip-vouchers-v1.js';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');

          let smoke=fs.readFileSync('scripts/smoke-hosting-png-v34.sh','utf8');
          if(!smoke.includes('/assets/items/pip-voucher-1000.png')){
            const marker="check_png /assets/items/enchant-card-master.png 64 114 0\n";
            const checks=amounts.map(a=>`check_png /assets/items/pip-voucher-${a}.png 1536 658 0`).join('\n')+'\n';
            smoke=smoke.replace(marker,marker+checks).replace('all 20 canonical PNG masters','all 28 canonical PNG masters');
            fs.writeFileSync('scripts/smoke-hosting-png-v34.sh',smoke);
          }
          NODE

      - name: Install hosting toolchain
        run: npm install

      - name: Validate Pip Voucher contract
        run: npm run check:pip-vouchers

      - name: Validate full Hosting release gate
        run: npm run check:hosting

      - name: Validate backend release gate
        run: npm run check:backend

      - name: Commit validated finalization and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pip-voucher-asset-import.yml .github/workflows/pip-voucher-finalize.yml
          git config user.name 'TTD Release Bot'
          git config user.email 'github-firebase-deployer@ttd-online-b8c0f.iam.gserviceaccount.com'
          git add assets/game-assets.json assets/immutable-assets.lock.json package.json scripts/smoke-hosting-png-v34.sh
          git diff --cached --check
          git commit -m 'Finalize Pip Voucher release contract'
          git push origin HEAD:feature/pip-voucher-items-v1
