name: Inspect single-player presentation parity

on:
  push:
    branches:
      - feature/moving-screen-presentation-parity-v1
    paths:
      - .github/workflows/inspect-presentation-parity.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect loading, start, finish, result, and back flows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files=[p for p in Path('.').rglob('*') if p.is_file() and p.suffix in {'.js','.mjs','.html'} and '.git' not in p.parts]
          pats=[
            r'loading-endless-horde',r'loading-al-hata',r'NOW LOADING',r'loading screen',
            r'MISSION START',r'Mission.mp3',r'Finish.mp3',r'Start.mp3',r'playMissionCue',r'playFinishCue',
            r'showZombieSummary',r'zSummaryOverlay',r'gameOverlay',r'endMatch\(',r'endEndlessHorde\(',r'campaignComplete',
            r'backBtn',r'data-ttd-back',r'pauseBtn',r'endRunBtn'
          ]
          rx=re.compile('|'.join(f'(?:{p})' for p in pats),re.I)
          for p in files:
            try: lines=p.read_text(errors='ignore').splitlines()
            except Exception: continue
            hits=[i for i,l in enumerate(lines) if rx.search(l)]
            if not hits: continue
            print(f'\n===== {p} =====')
            shown=set()
            for i in hits:
              a=max(0,i-5); b=min(len(lines),i+7)
              if any(j in shown for j in range(a,b)): continue
              shown.update(range(a,b))
              print(f'--- lines {a+1}-{b} ---')
              for j in range(a,b): print(f'{j+1:5}: {lines[j]}')
          PY
