name: Inspect single-player presentation parity

on:
  push:
    branches:
      - feature/moving-screen-presentation-parity-v1
    paths:
      - .github/workflows/inspect-presentation-parity.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Moving Screen lifecycle details
        shell: bash
        run: |
          echo '=== ENGINE LIFECYCLE ==='
          grep -nE "function (start|frame|finish|revealResult|exit)|finish\(|requestAnimationFrame\(frame\)|runtime\.finished|lives<=0|empty" online/moving-screen-engine-v5.js || true
          echo '=== ARCADE MOVING RESULT ==='
          grep -nE "movingResult|finishOnlineRun|movingMetrics|finalizeManual|overlayBtn|TTDArcadeModeShell" online/arcade-mode-shell-v2.js || true
          echo '=== PRESENTATION API ==='
          grep -nE "playMissionCue|playCombatCountdown|playFinishCue|presentOutcome|TTDGamePresentation" online/game-presentation-v1.js || true
          echo '=== LOAD ROUTER ==='
          nl -ba online/moving-screen-map-router-v2.js | sed -n '1,130p'
          echo '=== RUN CONTROLS ==='
          nl -ba online/singleplayer-run-controls-v1.js
          echo '=== LOADER KEYS ==='
          grep -nE "moving-screen-(engine|map-router|arcade-mode-shell|singleplayer-run-controls)|game-presentation" online/runtime-bridge-loader-v1.js || true
