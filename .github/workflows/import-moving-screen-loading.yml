name: Import Moving Screen Loading Master

on:
  push:
    branches:
      - feature/moving-screen-input-nav-loading-v1
    paths:
      - .github/workflows/import-moving-screen-loading.yml

permissions:
  contents: write

jobs:
  import-master:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v4
        with:
          ref: feature/moving-screen-input-nav-loading-v1
          fetch-depth: 0
      - name: Reconstitute exact uploaded master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/ui
          cat .asset-staging/moving-screen-loading/part-000.b64 .asset-staging/moving-screen-loading/part-001.b64 | tr -d '\r\n' | base64 --decode > assets/ui/loading-moving-screen.jpg
          test "$(stat -c%s assets/ui/loading-moving-screen.jpg)" = "449004"
          test "$(sha256sum assets/ui/loading-moving-screen.jpg | awk '{print $1}')" = "2559c53924c2d0f8d5ddc5733f1605b2522e9e7aecaa0208dc0868d9f2b36c57"
          file assets/ui/loading-moving-screen.jpg | grep -q 'JPEG image data'
      - name: Commit immutable master and remove staging chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TTD Asset Import"
          git config user.email "actions@users.noreply.github.com"
          git add assets/ui/loading-moving-screen.jpg
          git rm .asset-staging/moving-screen-loading/part-000.b64 .asset-staging/moving-screen-loading/part-001.b64
          git commit -m "Add exact Moving Screen loading master"
          git push origin HEAD:feature/moving-screen-input-nav-loading-v1
