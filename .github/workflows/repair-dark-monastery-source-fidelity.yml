name: Repair and Deploy Dark Monastery Source Fidelity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-dark-monastery-source-fidelity.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: dark-monastery-source-fidelity-repair
  cancel-in-progress: false

jobs:
  repair-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble exact Dark Monastery source-fidelity bundle
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const zlib=require('zlib');
          const parts=[];
          for(let i=0;i<6;i++)parts.push(fs.readFileSync(`.dm-repair/dark-monastery-v3.part${i}.b64`,'utf8').trim());
          const text=Buffer.from(parts.join(''),'base64').toString('utf8');
          const digest=crypto.createHash('sha256').update(text).digest('hex');
          if(digest!=='2badecdcb40c98d846cb198462995aee75ad028ab6aa28a37db497fd8d1b75d7')throw new Error(`Assembled Dark Monastery bundle hash mismatch: ${digest}`);
          if(!text.startsWith('(() => {'))throw new Error('Assembled Dark Monastery bundle is not JavaScript text.');
          new Function(text);
          const match=text.match(/const payload\s*=([\s\S]*?);\s*window\.__TTD_DARK_MONASTERY_V2_READY/);
          if(!match)throw new Error('Dark Monastery payload expression is missing.');
          const payload=Function(`"use strict"; return (${match[1]});`)();
          const source=zlib.gunzipSync(Buffer.from(payload,'base64')).toString('utf8');
          new Function(source);
          const required=[
            "const CAMERA_ZOOM=1.15",
            "const GUILLOTINE_APEX_HOLD=.375",
            "visualRevision:'source-fidelity-v3'",
            "northWallBrokenStair:true",
            "official-eight-room-map-v3-source-fidelity",
          ];
          for(const marker of required)if(!source.includes(marker))throw new Error(`Dark Monastery source is missing: ${marker}`);
          fs.writeFileSync('online/dark-monastery-adventure-v2.js',text,'utf8');

          const loaderPath='online/runtime-bridge-loader-v1.js';
          let loader=fs.readFileSync(loaderPath,'utf8');
          if(loader.includes('/online/dark-monastery-adventure-v2.js?v=2')){
            loader=loader.replace('/online/dark-monastery-adventure-v2.js?v=2','/online/dark-monastery-adventure-v2.js?v=3');
          }else if(!loader.includes('/online/dark-monastery-adventure-v2.js?v=3')){
            throw new Error('Could not find the Dark Monastery bridge cache key to bump.');
          }
          fs.writeFileSync(loaderPath,loader,'utf8');

          fs.rmSync('.dm-repair',{recursive:true,force:true});
          fs.rmSync('.github/workflows/repair-dark-monastery-source-fidelity.yml');
          console.log(`Assembled exact bundle ${digest}; source payload ${source.length} chars.`);
          NODE

      - name: Install hosting toolchain
        run: npm install

      - name: Validate source-fidelity Dark Monastery and deployable client
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-gameplay-resource-header-v1.mjs
          node scripts/check-dark-monastery-map-v2.mjs
          node scripts/check-dark-monastery-v1.mjs
          node scripts/check-dark-monastery-online-repeat-v1.mjs
          node scripts/check-dark-monastery-longrun-v1.mjs
          npm run check:hosting

      - name: Commit exact repaired release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BeybladeBattleArena'
          git config user.email 'stepmaniaredditrequests@gmail.com'
          git add -A
          git commit -m '[release] Repair Dark Monastery bundle and ship source fidelity'
          git push origin HEAD:main
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Committed repaired production candidate $(git rev-parse HEAD)"

      - name: Verify committed source tree is clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          [[ -z "$(git status --porcelain --untracked-files=no)" ]] || { git status --short; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ttd-online-b8c0f
          workload_identity_provider: projects/761371312112/locations/global/workloadIdentityPools/github-actions/providers/ttd-online
          service_account: github-firebase-deployer@ttd-online-b8c0f.iam.gserviceaccount.com

      - name: Stamp exact production build
        run: |
          printf '{"commit":"%s","ref":"main","builtAt":"%s"}\n' "$DEPLOY_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > build.json

      - name: Deploy Hosting
        run: npx firebase-tools deploy --only hosting --project ttd-online-b8c0f --non-interactive --force

      - name: Verify exact repaired commit is live
        env:
          LIVE_URL: https://ttd-online-b8c0f.web.app
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            body="$(curl -fsS -H 'Cache-Control: no-cache, no-store' "$LIVE_URL/build.json?verify=$DEPLOY_SHA-$attempt" || true)"
            if [[ "$body" == *"\"commit\":\"$DEPLOY_SHA\""* ]]; then
              echo "Verified production Hosting commit $DEPLOY_SHA"
              exit 0
            fi
            sleep 2
          done
          echo "Production verification failed: Hosting is not serving $DEPLOY_SHA"
          exit 1

      - name: Verify critical production assets
        env:
          LIVE_URL: https://ttd-online-b8c0f.web.app
        run: bash scripts/smoke-hosting-png-v34.sh
