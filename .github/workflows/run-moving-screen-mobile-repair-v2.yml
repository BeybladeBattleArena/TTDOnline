name: Run Moving Screen mobile repair v2

on:
  push:
    branches:
      - feature/moving-screen-mobile-smoothness-fix-v1
    paths:
      - .github/workflows/run-moving-screen-mobile-repair-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply repair script from one-shot source workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/fix-moving-screen-mobile-smoothness.yml').read_text(encoding='utf-8')
          start=source.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=source.index("          PY\n",start)
          block=source[start:end]
          block='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())+'\n'
          Path('/tmp/ttd-moving-screen-repair.py').write_text(block,encoding='utf-8')
          PY
          python /tmp/ttd-moving-screen-repair.py
      - name: Install dependencies
        run: npm install
      - name: Validate repaired hosting build
        run: npm run check:hosting
      - name: Commit verified source repair
        run: |
          git config user.name "BeybladeBattleArena"
          git config user.email "stepmaniaredditrequests@gmail.com"
          git add online.html online package.json scripts
          git commit -m "Fix Moving Screen mobile viewport and frame pacing"
          git push origin HEAD:feature/moving-screen-mobile-smoothness-fix-v1
