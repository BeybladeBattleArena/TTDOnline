name: Wire deck v18 temporary
on:
  push:
    branches:
      - agent/deck-social-levels-v18
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deck-social-levels-v18
      - name: Wire runtime bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('online/game-loader.js')
          s=p.read_text()
          needle="    '/online/collection-portrait-fit-v16.js?v=16',\n"
          addition="    '/online/deck-editor-v18.js?v=18',\n"
          if addition not in s:
              if needle not in s: raise SystemExit('collection bridge marker missing')
              s=s.replace(needle, needle+addition, 1)
              p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add online/game-loader.js
          git commit -m 'Wire explicit deck editor into game runtime'
          git push origin HEAD:agent/deck-social-levels-v18