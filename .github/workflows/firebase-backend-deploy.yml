name: Firebase Backend Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'database.rules.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-backend-deploy
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ttd-online-b8c0f
          workload_identity_provider: projects/761371312112/locations/global/workloadIdentityPools/github-actions/providers/ttd-online
          service_account: github-firebase-deployer@ttd-online-b8c0f.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root Firebase tooling
        run: npm install

      - name: Install Functions dependencies
        run: npm --prefix functions install

      - name: Validate backend code
        run: npm run check:backend

      - name: Deploy Firestore and Functions
        run: npx firebase-tools deploy --only firestore,functions --project ttd-online-b8c0f --non-interactive --force
