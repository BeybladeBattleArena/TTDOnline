name: Dice Finalize V2

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'dice-modernization-master-20260828'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm --prefix functions install
      - name: Apply final gameplay audit corrections
        run: node scripts/finalize-dice-modernization-v2.mjs
      - name: Refresh canonical backend mirror
        run: npm run update:catalog-mirror
      - name: Verify audit-specific invariants
        run: node scripts/finalize-dice-modernization-v2.mjs --verify
      - name: Validate complete repository
        run: npm run check
      - name: Verify patch semantics
        run: git diff --check
      - name: Commit only authoritative product files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/finalize-dice-modernization-v2.mjs .github/workflows/dice-finalize-v2.yml
          git add random-dice-game-33.html dicefile.json functions/dicefile.generated.json scripts/finalize-dice-modernization-v2.mjs .github/workflows/dice-finalize-v2.yml
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(random-dice-game-33\.html|dicefile\.json|functions/dicefile\.generated\.json|scripts/finalize-dice-modernization-v2\.mjs|\.github/workflows/dice-finalize-v2\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then echo "Unexpected files: $unexpected"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete final dice canon gameplay audit"
          git push origin HEAD:${{ github.head_ref }}
