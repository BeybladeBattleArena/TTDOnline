name: Assemble Soul Saber Pure Vector

on:
  push:
    branches: [agent/soul-saber-pure-vector-repair]
    paths:
      - '.asset-staging/soul-saber/**'

permissions:
  contents: write

concurrency:
  group: assemble-soul-saber-vector
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact staged SVG
        shell: bash
        run: |
          shopt -s nullglob
          parts=(.asset-staging/soul-saber/part-*.b64)
          if [[ ${#parts[@]} -ne 11 ]]; then
            echo "Waiting for all 11 vector source parts; found ${#parts[@]}."
            exit 0
          fi
          cat "${parts[@]}" | tr -d '\r\n ' | base64 --decode > assets/soul-saber-attack.svg
          node <<'NODE'
          const fs=require('fs');
          const svg=fs.readFileSync('assets/soul-saber-attack.svg','utf8');
          if(!svg.startsWith('<svg')) throw new Error('Assembled Soul Saber is not SVG.');
          if(!svg.includes('width="128"') || !svg.includes('height="128"') || !svg.includes('viewBox="0 0 128 128"')) throw new Error('Soul Saber SVG geometry contract mismatch.');
          if(/<image\b|data:image|<script\b|javascript:/i.test(svg)) throw new Error('Soul Saber must remain pure vector with no embedded raster/executable content.');
          if((svg.match(/<path\b/g)||[]).length < 20) throw new Error('Soul Saber vector detail unexpectedly collapsed.');
          console.log('Pure-vector Soul Saber assembled and validated.');
          NODE
      - name: Commit assembled SVG to repair branch
        shell: bash
        run: |
          if git diff --quiet -- assets/soul-saber-attack.svg; then
            echo "No assembled asset change to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/soul-saber-attack.svg
          git commit -m 'Assemble pure-vector Soul Saber attack asset'
          git push origin HEAD:agent/soul-saber-pure-vector-repair
