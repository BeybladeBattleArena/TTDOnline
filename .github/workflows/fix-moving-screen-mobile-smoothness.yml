name: Fix Moving Screen mobile smoothness

on:
  push:
    branches:
      - feature/moving-screen-mobile-smoothness-fix-v1
    paths:
      - .github/workflows/fix-moving-screen-mobile-smoothness.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply mobile viewport, loading, and frame-pacing repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace(path, old, new, count=1):
              text=read(path)
              if old not in text:
                  raise SystemExit(f'Missing required patch marker in {path}: {old[:120]!r}')
              text=text.replace(old,new,count)
              write(path,text)

          def sub(path, pattern, replacement, count=1):
              text=read(path)
              next_text,n=re.subn(pattern,replacement,text,count=count,flags=re.S)
              if n!=count:
                  raise SystemExit(f'Expected {count} regex patch in {path}, got {n}: {pattern[:100]}')
              write(path,next_text)

          def replace_repo(old,new):
              result=subprocess.run(['git','grep','-l','-F',old,'--',':(exclude)node_modules'],text=True,capture_output=True)
              files=[line.strip() for line in result.stdout.splitlines() if line.strip()]
              for path in files:
                  text=read(path)
                  if old in text:
                      write(path,text.replace(old,new))
              print(f'cache marker {old} -> {new}: {len(files)} file(s)')

          # 1) Android Chrome must use the visual viewport, not the larger layout viewport.
          replace('online.html',
              ".shell{height:100dvh;min-height:100vh;display:grid;grid-template-rows:44px minmax(0,1fr);overflow:hidden;background:var(--bg);transition:grid-template-rows .16s ease}",
              ".shell{height:var(--ttd-visual-vh,100dvh);min-height:0;max-height:var(--ttd-visual-vh,100dvh);display:grid;grid-template-rows:44px minmax(0,1fr);overflow:hidden;background:var(--bg);transition:grid-template-rows .16s ease}")
          viewport_script='''<script id="ttdVisualViewportV1">\n(() => {\n  const root=document.documentElement;\n  let raf=0;\n  function syncVisualViewport(){\n    raf=0;\n    const viewport=window.visualViewport;\n    const height=Math.max(1,Math.round(viewport?.height||window.innerHeight||root.clientHeight||1));\n    root.style.setProperty('--ttd-visual-vh',`${height}px`);\n  }\n  function queueVisualViewport(){if(!raf)raf=requestAnimationFrame(syncVisualViewport);}\n  syncVisualViewport();\n  window.addEventListener('resize',queueVisualViewport,{passive:true});\n  window.visualViewport?.addEventListener('resize',queueVisualViewport,{passive:true});\n})();\n</script>\n\n'''
          replace('online.html','<script src="/online/bridge-session-guard-v2.js?v=2"></script>',viewport_script+'<script src="/online/bridge-session-guard-v2.js?v=2"></script>')

          # Keep the account shell collapsed whenever Moving Screen is actually running.
          replace('online/shell-ui-v9.js',
              "    if (message.type === 'ttd:game-screen-change') {\n      if (message.screen === 'game') setCollapsed(true, false);\n      else if (message.screen === 'home') setCollapsed(false, false);\n    }",
              "    if (message.type === 'ttd:game-screen-change') {\n      if (message.screen === 'game') setCollapsed(true, false);\n      else if (message.screen === 'home') setCollapsed(false, false);\n    }\n    if (message.type === 'ttd:moving-screen-active') {\n      setCollapsed(!!message.active, false);\n    }")

          # 2) Use the same eager decoded-art preload path as the existing Zombie/Boss loading screens.
          replace('online/startup-gate-v33.js',
              "    '/assets/ui/loading-al-hata.png',\n",
              "    '/assets/ui/loading-al-hata.png',\n    '/assets/ui/loading-moving-screen.png',\n")

          router='online/moving-screen-map-router-v2.js'
          replace(router,'  const LOADING_MIN_MS=720;\n  const LOADING_ASSET=', '  const LOADING_MIN_MS=720;\n  const LOADING_DECODE_MAX_MS=2500;\n  const LOADING_ASSET=')
          replace(router,'  let startTimer=0;\n  let raf=0;','  let startToken=0;\n  let presentationTimer=0;')
          replace(router,
              "  function asset(path){try{return typeof window.__TTD_ASSET_URL==='function'?window.__TTD_ASSET_URL(path):path;}catch(_){return path;}}\n",
              "  function asset(path){try{return typeof window.__TTD_ASSET_URL==='function'?window.__TTD_ASSET_URL(path):path;}catch(_){return path;}}\n  const sleep=(ms)=>new Promise((resolve)=>setTimeout(resolve,ms));\n  function announceActive(active){try{window.dispatchEvent(new CustomEvent('ttd:moving-screen-active',{detail:{active:!!active}}));}catch(_){}try{window.parent?.postMessage({type:'ttd:moving-screen-active',active:!!active},location.origin);}catch(_){}}\n")
          sub(router,
              r"  function showLoading\(\)\{.*?\n  function hideLoading\(\)\{",
              """  function showLoading(){installLoadingStyle();document.getElementById(LOADING_ID)?.remove();const root=document.createElement('div');root.id=LOADING_ID;const img=document.createElement('img');img.alt='Moving Screen loading screen';img.decoding='async';img.loading='eager';img.src=asset(LOADING_ASSET);root.appendChild(img);(document.getElementById('app')||document.body).appendChild(root);const ready=new Promise((resolve)=>{let settled=false;const done=()=>{if(settled)return;settled=true;resolve();};img.addEventListener('load',done,{once:true});img.addEventListener('error',done,{once:true});if(img.complete)done();if(typeof img.decode==='function')img.decode().then(done).catch(()=>{});});return{root,img,ready};}\n  function hideLoading(){""")
          sub(router,
              r"  function tick\(\)\{.*?\n\n  function beginStage",
              """  function presentationTick(){if(base.active)syncPresentation();else if(activeStageId!==ENGINE_SLOT&&!pendingStageId){document.getElementById('gameScreen')?.classList.remove('ttd-construction-climb');restoreDefault();}}\n  function startPresentationSync(){stopPresentationSync();presentationTick();presentationTimer=setInterval(presentationTick,650);}\n  function stopPresentationSync(){if(presentationTimer)clearInterval(presentationTimer);presentationTimer=0;}\n\n  function beginStage""")
          sub(router,
              r"  function beginStage\(stageId\)\{.*?\n  function start\(stageId=ENGINE_SLOT\)\{.*?\n  function exit\(\)\{.*?\n\n  function passthrough",
              """  function beginStage(stageId){const stage=installStage(stageId);try{base.start();}catch(error){restoreDefault();hideLoading();announceActive(false);throw error;}if(!base.active){restoreDefault();hideLoading();announceActive(false);return false;}activeStage=stage;announceActive(true);startPresentationSync();syncPresentation();try{const copy=stageCopy();window.toastGlobal?.(`10 lives · ${copy.goal} KOs · seize the ${copy.crown.toLowerCase()} flag`);}catch(_){}requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(hideLoading,80)));return true;}\n  function start(stageId=ENGINE_SLOT){if(base.active||pendingStageId)return false;const stage=resolve(stageId);if(!stage)throw new Error(`Unknown Moving Screen stage: ${stageId}`);pendingStageId=stage.id;activeStage=stage;const token=++startToken;const loading=showLoading();Promise.all([sleep(LOADING_MIN_MS),Promise.race([loading.ready,sleep(LOADING_DECODE_MAX_MS)])]).then(()=>{if(token!==startToken||pendingStageId!==stage.id)return;const id=pendingStageId;pendingStageId=null;if(!id){hideLoading();return;}try{beginStage(id);}catch(error){console.error('Moving Screen delayed start failed',error);hideLoading();announceActive(false);}});return true;}\n  function exit(){pendingStageId=null;startToken++;stopPresentationSync();hideLoading();announceActive(false);try{return base.exit();}finally{document.getElementById('gameScreen')?.classList.remove('ttd-construction-climb');restoreDefault();}}\n\n  function passthrough""")
          replace(router,'  cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);','  presentationTick();')

          # 3) Remove broad DOM observers and high-frequency polling from the gameplay hot path.
          replace('online/moving-screen-mobile-frame-v2.js',
              "  installStyles();sync();const root=document.getElementById('app')||document.documentElement;new MutationObserver(()=>requestAnimationFrame(sync)).observe(root,{subtree:true,attributes:true,attributeFilter:['class'],childList:true});window.addEventListener('resize',()=>requestAnimationFrame(sync));",
              "  installStyles();sync();const game=document.getElementById('gameScreen');if(game)new MutationObserver(()=>requestAnimationFrame(sync)).observe(game,{attributes:true,attributeFilter:['class']});const queue=()=>requestAnimationFrame(sync);window.addEventListener('resize',queue,{passive:true});window.visualViewport?.addEventListener('resize',queue,{passive:true});")

          replace('online/moving-screen-die-input-v1.js',
              "  function bind(){const next=document.getElementById('laneWrap');if(next===lane)return;if(lane){lane.removeEventListener('pointerdown',down,true);lane.removeEventListener('pointermove',move,true);lane.removeEventListener('pointerup',up,true);lane.removeEventListener('pointercancel',cancel,true);}lane=next;if(!lane)return;lane.addEventListener('pointerdown',down,true);lane.addEventListener('pointermove',move,true);lane.addEventListener('pointerup',up,true);lane.addEventListener('pointercancel',cancel,true);}",
              "  function bind(){const next=document.getElementById('laneWrap');if(next===lane)return!!lane;if(lane){lane.removeEventListener('pointerdown',down,true);lane.removeEventListener('pointermove',move,true);lane.removeEventListener('pointerup',up,true);lane.removeEventListener('pointercancel',cancel,true);}lane=next;if(!lane)return false;lane.addEventListener('pointerdown',down,true);lane.addEventListener('pointermove',move,true);lane.addEventListener('pointerup',up,true);lane.addEventListener('pointercancel',cancel,true);return true;}")
          replace('online/moving-screen-die-input-v1.js',
              "  const observer=new MutationObserver(bind);observer.observe(document.documentElement,{childList:true,subtree:true});bind();",
              "  if(!bind()){const observer=new MutationObserver(()=>{if(bind())observer.disconnect();});observer.observe(document.documentElement,{childList:true,subtree:true});}")

          hud='online/moving-screen-battle-hud-v1.js'
          sub(hud,
              r"  function sync\(\)\{.*?\n  setInterval\(sync,120\);sync\(\);",
              """  function sync(){const bar=ensureBar();if(!bar){document.getElementById(BAR_ID)?.remove();return;}build(bar);const s=api()?.state,od=s?.od||{};const fill=bar.querySelector('#ttdMsDriveMiniV1>i');const width=`${Math.max(0,Math.min(100,(Number(od.drive)||0)/Math.max(1,Number(od.driveMax)||100)*100)).toFixed(2)}%`;if(fill&&fill.dataset.width!==width){fill.dataset.width=width;fill.style.width=width;}const p=pair(),defs=odCatalog();bar.querySelectorAll('.ttdMsOdButtonV1').forEach((b)=>{const index=Number(b.dataset.od)||0,key=keyOf(p[index]),def=defs[key],ready=!!key&&Number(od.drive)>=Number(od.driveMax)-.001&&Number(od.dp)>=Number(def?.dpCost||Infinity),label=`${def?.name||`Overdrive ${index+1}`} · ${Number(od.dp)||0} DP available${ready?' · ready':''}`,sig=`${ready?1:0}|${label}`;if(b.dataset.stateSig!==sig){b.dataset.stateSig=sig;b.disabled=!ready;b.setAttribute('aria-label',label);}});}\n  let poll=0;function setPolling(active){if(active){sync();if(!poll)poll=setInterval(sync,220);}else{if(poll)clearInterval(poll);poll=0;sync();}}window.addEventListener('ttd:moving-screen-active',(event)=>setPolling(!!event.detail?.active));setPolling(!!api()?.active);""")

          replace('online/singleplayer-run-controls-v1.js',
              "  installStyle();sync();new MutationObserver(()=>requestAnimationFrame(sync)).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});setInterval(sync,240);",
              "  installStyle();sync();const game=document.getElementById('gameScreen');if(game)new MutationObserver(()=>requestAnimationFrame(sync)).observe(game,{attributes:true,attributeFilter:['class'],childList:true});window.addEventListener('ttd:moving-screen-active',()=>requestAnimationFrame(sync));")

          # Bust only the modified runtime sources; update every tracked reference/validator consistently.
          for old,new in [
              ('/online/runtime-bridge-loader-v1.js?v=1','/online/runtime-bridge-loader-v1.js?v=2'),
              ('/online/moving-screen-map-router-v2.js?v=1','/online/moving-screen-map-router-v2.js?v=2'),
              ('/online/moving-screen-die-input-v1.js?v=1','/online/moving-screen-die-input-v1.js?v=2'),
              ('/online/moving-screen-battle-hud-v1.js?v=1','/online/moving-screen-battle-hud-v1.js?v=2'),
              ('/online/moving-screen-mobile-frame-v2.js?v=1','/online/moving-screen-mobile-frame-v2.js?v=2'),
              ('/online/singleplayer-run-controls-v1.js?v=1','/online/singleplayer-run-controls-v1.js?v=2'),
              ('/online/startup-gate-v33.js?v=33','/online/startup-gate-v33.js?v=34'),
              ('/online/shell-ui-v9.js?v=9','/online/shell-ui-v9.js?v=10'),
          ]:
              replace_repo(old,new)

          # Refresh the existing Moving Screen validator's loading transition contract.
          replace('scripts/check-moving-screen-v1.mjs',
              "'img.src=asset(LOADING_ASSET)','base.start()','setTimeout(hideLoading,180)'",
              "'img.src=asset(LOADING_ASSET)','base.start()','LOADING_DECODE_MAX_MS=2500','Promise.all([sleep(LOADING_MIN_MS)','startPresentationSync()','announceActive(true)'")

          # Add a regression check for the exact Android viewport/performance failure reported in production.
          validator=r'''import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {pathToFileURL} from 'node:url';
          import * as espree from 'espree';

          const must=(condition,message)=>{if(!condition)throw new Error(message);};
          const files={
            online:'online.html',shell:'online/shell-ui-v9.js',router:'online/moving-screen-map-router-v2.js',
            gate:'online/startup-gate-v33.js',frame:'online/moving-screen-mobile-frame-v2.js',hud:'online/moving-screen-battle-hud-v1.js',
            input:'online/moving-screen-die-input-v1.js',run:'online/singleplayer-run-controls-v1.js'
          };
          const src=Object.fromEntries(Object.entries(files).map(([key,file])=>[key,fs.readFileSync(file,'utf8')]));
          for(const key of ['shell','router','gate','frame','hud','input','run'])espree.parse(src[key],{ecmaVersion:'latest',sourceType:'script'});
          must(src.online.includes('height:var(--ttd-visual-vh,100dvh);min-height:0;max-height:var(--ttd-visual-vh,100dvh)'),'Online shell must be constrained to the real visual viewport.');
          must(!src.online.includes('.shell{height:100dvh;min-height:100vh'),'Layout-viewport min-height regression would hide Moving Screen controls under Android browser chrome.');
          for(const marker of ['window.visualViewport','--ttd-visual-vh','ttdVisualViewportV1'])must(src.online.includes(marker),`Visual viewport contract missing: ${marker}`);
          must(src.gate.includes("'/assets/ui/loading-moving-screen.png'"),'Moving Screen loading art must use the established startup image preload.');
          for(const marker of ['LOADING_DECODE_MAX_MS=2500','img.loading=\'eager\'','img.decode()','Promise.all([sleep(LOADING_MIN_MS)','startPresentationSync()','announceActive(true)'])must(src.router.includes(marker),`Decoded loading transition contract missing: ${marker}`);
          must(!src.router.includes('requestAnimationFrame(tick)'),'Moving Screen presentation sync may not run as a permanent animation-frame loop.');
          must(!src.frame.includes('observe(root,{subtree:true'),'Moving Screen mobile frame may not observe the full app subtree.');
          must(!src.hud.includes('setInterval(sync,120)'),'Moving Screen battle HUD may not poll at the retired 120 ms cadence.');
          must(src.hud.includes("window.addEventListener('ttd:moving-screen-active'")&&src.hud.includes('setInterval(sync,220)'),'Moving Screen HUD polling must be active-run scoped.');
          must(src.input.includes('observer.disconnect()'),'Die input observer must disconnect after lane binding.');
          must(!src.run.includes('setInterval(sync,240)')&&!src.run.includes('observe(document.documentElement,{subtree:true'),'Single-player run controls may not poll/observe the entire gameplay document.');
          must(src.shell.includes("message.type === 'ttd:moving-screen-active'"),'Online account shell must collapse explicitly for Moving Screen.');

          const chrome=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          must(chrome,'Moving Screen Android viewport smoke requires Chrome/Chromium.');
          const frameUrl=pathToFileURL(path.join(process.cwd(),files.frame)).href;
          const hudUrl=pathToFileURL(path.join(process.cwd(),files.hud)).href;
          const harness=path.join(os.tmpdir(),`ttd-ms-mobile-runtime-${process.pid}.html`);
          const html=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040b;color:#fff}#app{position:fixed;inset:0}.screen{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}#hud{display:flex;flex:0 0 auto;min-height:58px}.hud-left{display:flex;flex:1}.hud-stats{display:flex}#laneWrap{position:relative;flex:1 1 0;min-height:0;background:#111}#tray{display:flex;flex-direction:column;flex:0 0 auto;background:#060914}#ttdMsControlsV4{display:grid;min-height:50px}#ttdMsSummonV4{min-height:50px}</style></head><body><div id="app"><div id="gameScreen" class="screen active ttd-moving-screen-v4"><div id="hud"><div class="hud-left"><button id="pauseBtn">Back</button><button id="endRunBtn">End Run</button><div id="modeLabel">Moving Screen · Construction Climb</div></div><div class="hud-stats"><span>0/30</span><span>70</span><span>10</span></div></div><div id="laneWrap"><canvas></canvas></div><div id="tray"><div id="ttdMsControlsV4"><div>Tap a Die to select it.</div><div id="ttdMsButtonsV4"><button id="ttdMsSummonV4">SUMMON</button></div></div></div></div><pre id="result">PENDING</pre></div><script>window.__errs=[];addEventListener('error',e=>__errs.push(String(e.message||e.error)));window.TTDMovingScreen={active:true,stage:{name:'Construction Climb'},state:{od:{drive:0,driveMax:100,dp:45,maxDp:45}},activateOverdriveSlot(){}};window.getActiveDeck=()=>['a','b','c','d','e'].map(key=>({key}));window.DICE=Object.fromEntries(['a','b','c','d','e'].map(key=>[key,{name:key.toUpperCase()}]));window.renderGlyph=()=>'<span>◆</span>';window.account={activeDeckIdx:0,overdriveDecks:[[null,null]]};window.__TTD_OVERDRIVE={equipped:()=>[null,null],catalog:()=>({dice:{}})};</script><script src="${frameUrl}"></script><script src="${hudUrl}"></script><script>setTimeout(()=>{const game=document.getElementById('gameScreen'),tray=document.getElementById('tray'),bar=document.getElementById('ttdMsBattleBarV1'),summon=document.getElementById('ttdMsSummonV4'),lane=document.getElementById('laneWrap');const gr=game.getBoundingClientRect(),tr=tray.getBoundingClientRect(),br=bar?.getBoundingClientRect(),sr=summon.getBoundingClientRect(),lr=lane.getBoundingClientRect();const report={innerHeight,gameBottom:gr.bottom,trayBottom:tr.bottom,barBottom:br?.bottom||9999,summonBottom:sr.bottom,laneHeight:lr.height,barPresent:!!bar,summonVisible:sr.width>0&&sr.height>0,gameInside:gr.bottom<=innerHeight+.5,trayInside:tr.bottom<=innerHeight+.5,barInside:(br?.bottom||9999)<=innerHeight+.5,summonInside:sr.bottom<=innerHeight+.5,laneUsable:lr.height>250,noErrors:__errs.length===0};report.ok=['barPresent','summonVisible','gameInside','trayInside','barInside','summonInside','laneUsable','noErrors'].every(k=>report[k]===true);document.getElementById('result').textContent=JSON.stringify(report);},420);</script></body></html>`;
          fs.writeFileSync(harness,html);
          let dom='';try{dom=execFileSync(chrome,['--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--disable-background-networking','--disable-component-update','--disable-default-apps','--no-first-run','--allow-file-access-from-files','--window-size=390,650','--virtual-time-budget=1400','--dump-dom',pathToFileURL(harness).href],{encoding:'utf8',maxBuffer:4*1024*1024,timeout:40000,stdio:['ignore','pipe','pipe']});}finally{try{fs.unlinkSync(harness);}catch{}}
          const match=dom.match(/<pre id="result">([\s\S]*?)<\/pre>/i);must(match,'Headless Chrome did not return Moving Screen Android viewport results.');const decoded=match[1].replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');const report=JSON.parse(decoded);if(!report.ok){console.error('Moving Screen Android viewport smoke failed:',JSON.stringify(report,null,2));process.exit(1);}console.log('Moving Screen Android viewport + runtime pacing verified:',JSON.stringify(report));
          '''
          # Remove workflow indentation from the generated JS.
          validator='\n'.join(line[10:] if line.startswith('          ') else line for line in validator.splitlines())+'\n'
          write('scripts/check-moving-screen-mobile-runtime-v1.mjs',validator)
          replace('package.json',
              '"check:moving-screen-frame": "node scripts/check-moving-screen-mobile-frame-v1.mjs",',
              '"check:moving-screen-frame": "node scripts/check-moving-screen-mobile-frame-v1.mjs && node scripts/check-moving-screen-mobile-runtime-v1.mjs",')

          print(subprocess.check_output(['git','diff','--stat'],text=True))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate repaired hosting build
        run: npm run check:hosting

      - name: Commit verified repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "BeybladeBattleArena"
          git config user.email "stepmaniaredditrequests@gmail.com"
          git rm .github/workflows/fix-moving-screen-mobile-smoothness.yml
          git add online.html online package.json scripts
          git commit -m "Fix Moving Screen mobile viewport and frame pacing"
          git push origin HEAD:feature/moving-screen-mobile-smoothness-fix-v1
