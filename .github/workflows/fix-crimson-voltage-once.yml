name: One-time Crimson Current Voltage gate correction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Correct Crimson Current C1 Voltage gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct C1 Voltage gating and guard it
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          game=Path('random-dice-game-33.html')
          text=game.read_text()
          old="if(!actuate)s.voltage=Math.min(3,stored+1);"
          new="if(c>=2&&!actuate)s.voltage=Math.min(3,stored+1);"
          if text.count(old)!=1:
              raise SystemExit(f'Expected exactly one old Voltage increment gate, found {text.count(old)}')
          game.write_text(text.replace(old,new,1))
          guard=Path('scripts/check-sumo-crimson-v1.mjs')
          g=guard.read_text()
          marker="must(game.includes(\"extraCrit=.15\"),'Crimson C7 Max Voltage critical bonus missing.');"
          addition="must(game.includes(\"if(c>=2&&!actuate)s.voltage=Math.min(3,stored+1);\"),'Crimson Voltage must begin at C2, not C1.');"
          if addition not in g:
              if marker not in g: raise SystemExit('Could not find Crimson regression insertion marker.')
              g=g.replace(marker,marker+'\n'+addition,1)
          guard.write_text(g)
          PY
          npm install
          npm run check:sumo-crimson
          npm run check:hosting
          git diff --check
      - name: Commit corrected canonical source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-crimson-voltage-once.yml
          git config user.name 'BeybladeBattleArena'
          git config user.email 'stepmaniaredditrequests@gmail.com'
          git add -A
          git diff --cached --quiet && { echo 'No correction was produced.'; exit 1; }
          git commit -m '[release] Gate Crimson Current Voltage at C2'
          git push origin HEAD:main
