name: Patch v6 canonical snapshot

on:
  push:
    branches: [fix/v6-canonical-snapshot-20260828]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patch-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v6-canonical-snapshot-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source repair
        run: node scripts/patch-v6-canonical-snapshot.mjs
      - name: Validate repaired tree
        run: |
          npm install
          npm --prefix functions install
          npm run check:v6-canonical-snapshot
          npm run check
      - name: Commit repaired product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BeybladeBattleArena"
          git config user.email "stepmaniaredditrequests@gmail.com"
          git add functions/singleplayer-v6.js online/singleplayer-bridge-v6.js online/game-bridge-inner.js online/runtime-bridge-loader-v1.js scripts/check-v6-canonical-snapshot-v1.mjs package.json
          git diff --cached --exit-code && { echo 'No patch changes produced.'; exit 1; } || true
          git commit -m "[patch-applied] Fix v6 canonical full-account sync"
          git push origin HEAD:fix/v6-canonical-snapshot-20260828
