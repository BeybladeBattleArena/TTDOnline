name: One-time online Sumo and Crimson Current test codes

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  add-codes:
    if: github.event.head_commit.message == 'Add online test codes for Sumo and Crimson Current'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add C1-C7 built-in online redemption codes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('functions/gift-v7-secure.js')
          s=p.read_text()
          marker="  'TTD-SLITHER-C7': { label:'Slither Vine C7 Test Grant', reward:{ dice:[{ key:'slithervine', cls:7 }] } },\n"
          if marker not in s:
              raise SystemExit('Could not find DEV_CODES insertion marker.')
          block="""  'TTD-SUMO-C1': { label:'Sumo C1 Test Grant', reward:{ dice:[{ key:'sumo', cls:1 }] } },
  'TTD-SUMO-C2': { label:'Sumo C2 Test Grant', reward:{ dice:[{ key:'sumo', cls:2 }] } },
  'TTD-SUMO-C3': { label:'Sumo C3 Test Grant', reward:{ dice:[{ key:'sumo', cls:3 }] } },
  'TTD-SUMO-C4': { label:'Sumo C4 Test Grant', reward:{ dice:[{ key:'sumo', cls:4 }] } },
  'TTD-SUMO-C5': { label:'Sumo C5 Test Grant', reward:{ dice:[{ key:'sumo', cls:5 }] } },
  'TTD-SUMO-C6': { label:'Sumo C6 Test Grant', reward:{ dice:[{ key:'sumo', cls:6 }] } },
  'TTD-SUMO-C7': { label:'Sumo C7 Test Grant', reward:{ dice:[{ key:'sumo', cls:7 }] } },
  'TTD-CRIMSON-C1': { label:'Crimson Current C1 Test Grant', reward:{ dice:[{ key:'crimsoncurrent', cls:1 }] } },
  'TTD-CRIMSON-C2': { label:'Crimson Current C2 Test Grant', reward:{ dice:[{ key:'crimsoncurrent', cls:2 }] } },
  'TTD-CRIMSON-C3': { label:'Crimson Current C3 Test Grant', reward:{ dice:[{ key:'crimsoncurrent', cls:3 }] } },
  'TTD-CRIMSON-C4': { label:'Crimson Current C4 Test Grant', reward:{ dice:[{ key:'crimsoncurrent', cls:4 }] } },
  'TTD-CRIMSON-C5': { label:'Crimson Current C5 Test Grant', reward:{ dice:[{ key:'crimsoncurrent', cls:5 }] } },
  'TTD-CRIMSON-C6': { label:'Crimson Current C6 Test Grant', reward:{ dice:[{ key:'crimsoncurrent', cls:6 }] } },
  'TTD-CRIMSON-C7': { label:'Crimson Current C7 Test Grant', reward:{ dice:[{ key:'crimsoncurrent', cls:7 }] } },
"""
          if 'TTD-SUMO-C1' in s or 'TTD-CRIMSON-C1' in s:
              raise SystemExit('Codes already present; refusing duplicate insertion.')
          p.write_text(s.replace(marker,marker+block,1))
          PY
      - name: Install and validate backend
        shell: bash
        run: |
          npm install
          npm --prefix functions install
          node --check functions/gift-v7-secure.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('functions/gift-v7-secure.js','utf8');
          for (const family of [['TTD-SUMO-C','sumo'],['TTD-CRIMSON-C','crimsoncurrent']]) {
            for (let cls=1; cls<=7; cls++) {
              const code=family[0]+cls;
              if(!s.includes(`'${code}'`)) throw new Error('Missing '+code);
              if(!s.includes(`key:'${family[1]}', cls:${cls}`)) throw new Error('Missing reward '+family[1]+' C'+cls);
            }
          }
          const catalog=require('./functions/dicefile.generated.json');
          if(catalog.dice?.sumo?.rarity!=='common') throw new Error('Backend catalog missing Common Sumo.');
          if(catalog.dice?.crimsoncurrent?.rarity!=='rare') throw new Error('Backend catalog missing Rare Crimson Current.');
          console.log('Online Sumo/Crimson C1-C7 test codes verified.');
          NODE
          npm run check:backend
          git diff --check
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ttd-online-b8c0f
          workload_identity_provider: projects/761371312112/locations/global/workloadIdentityPools/github-actions/providers/ttd-online
          service_account: github-firebase-deployer@ttd-online-b8c0f.iam.gserviceaccount.com
      - name: Deploy only online gift-code function
        run: npx firebase-tools deploy --only functions:redeemOnlineGiftCode --project ttd-online-b8c0f --non-interactive --force
      - name: Commit authoritative backend source and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/add-sumo-crimson-online-codes-once.yml
          git config user.name 'BeybladeBattleArena'
          git config user.email 'stepmaniaredditrequests@gmail.com'
          git add -A
          git diff --cached --quiet && { echo 'No source changes produced.'; exit 1; }
          git commit -m 'Add online Sumo and Crimson C1-C7 test codes'
          git push origin HEAD:main
