name: Pip Voucher Alpha One Shot

on:
  push:
    branches:
      - feature/pip-voucher-transparency-sellfix-v1

permissions:
  contents: write

jobs:
  convert:
    if: ${{ !contains(github.event.head_commit.message, '[voucher-alpha-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Make voucher exterior background transparent
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import deque
          from PIL import Image
          import numpy as np

          amounts=(1000,5000,10000,20000,40000,60000,80000,100000)
          for amount in amounts:
              path=Path(f'assets/items/pip-voucher-{amount}.png')
              img=Image.open(path).convert('RGBA')
              px=np.array(img)
              rgb=px[:,:,:3]
              candidate=rgb.max(axis=2)<=35
              h,w=candidate.shape
              exterior=np.zeros((h,w), dtype=bool)
              q=deque()
              def seed(y,x):
                  if candidate[y,x] and not exterior[y,x]:
                      exterior[y,x]=True
                      q.append((y,x))
              for x in range(w):
                  seed(0,x); seed(h-1,x)
              for y in range(h):
                  seed(y,0); seed(y,w-1)
              while q:
                  y,x=q.popleft()
                  for dy,dx in ((1,0),(-1,0),(0,1),(0,-1)):
                      yy,xx=y+dy,x+dx
                      if 0<=yy<h and 0<=xx<w and candidate[yy,xx] and not exterior[yy,xx]:
                          exterior[yy,xx]=True
                          q.append((yy,xx))
              px[exterior,3]=0
              out=Image.fromarray(px,'RGBA')
              if out.size!=(1536,658):
                  raise SystemExit(f'{path}: unexpected size {out.size}')
              if int((px[:,:,3]==0).sum()) < 10000:
                  raise SystemExit(f'{path}: transparency pass removed too little exterior background')
              out.save(path,format='PNG',optimize=False,compress_level=9)
              print(path, 'transparent pixels', int((px[:,:,3]==0).sum()))
          PY
      - name: Commit transparent voucher masters
        run: |
          git config user.name "BeybladeBattleArena"
          git config user.email "stepmaniaredditrequests@gmail.com"
          git add assets/items/pip-voucher-*.png
          if git diff --cached --quiet; then
            echo "No voucher alpha changes to commit."
            exit 0
          fi
          git commit -m "Make Pip Voucher backgrounds transparent [voucher-alpha-generated]"
          git push origin HEAD:feature/pip-voucher-transparency-sellfix-v1
