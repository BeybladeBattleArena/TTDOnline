name: Import TTD Audio Assets v27

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  id-token: write

jobs:
  import-audio:
    if: github.event.pull_request.head.ref == 'agent/music-routing-v27'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/music-routing-v27

      - name: Skip if audio already imported
        id: existing
        shell: bash
        run: |
          if [[ -s assets/audio/main-menu.webm && -s assets/audio/shop-remix.webm && -s assets/audio/deck-construction.webm && -s assets/audio/welcome-rng-1.mp3 && -s assets/audio/welcome-rng-2.mp3 && -s assets/audio/welcome-rng-3.mp3 && -s assets/audio/welcome-rng-4.mp3 ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate as deploy service account
        id: audio-auth
        if: steps.existing.outputs.ready != 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: ttd-online-b8c0f
          workload_identity_provider: projects/761371312112/locations/global/workloadIdentityPools/github-actions/providers/ttd-online
          service_account: github-firebase-deployer@ttd-online-b8c0f.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Download shared audio into Hosting assets
        if: steps.existing.outputs.ready != 'true'
        shell: bash
        env:
          DRIVE_TOKEN: ${{ steps.audio-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          fetch_drive() {
            local id="$1" out="$2"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${DRIVE_TOKEN}" \
              "https://www.googleapis.com/drive/v3/files/${id}?alt=media" \
              --output "${out}"
            test -s "${out}"
          }
          fetch_drive 1rGeuuwDgXdCvejmrlybuOXyL9U9ztNYm assets/audio/main-menu.webm
          fetch_drive 14wBNlUE4m7tDV-xelfTcWP0lXzZBEJBz assets/audio/shop-remix.webm
          fetch_drive 1KwSIP1gyD9lsbMA6FzXBUXS2D2YyU0DF assets/audio/deck-construction.webm
          fetch_drive 1nqKZzkCPAQkHKaOfl7Y4AEvxkI2-bFGP assets/audio/welcome-rng-1.mp3
          fetch_drive 1y0eYk0QsVK92VH18AKQVzwVpTWtORj3h assets/audio/welcome-rng-2.mp3
          fetch_drive 1j5xzbbJY0ArqB57vHPea2Q0303Xyue4P assets/audio/welcome-rng-3.mp3
          fetch_drive 17fiTf-JPKAP-FUA3rNMQPm2an6bqEjRt assets/audio/welcome-rng-4.mp3
          ls -lh assets/audio

      - name: Commit audio binaries to branch
        if: steps.existing.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio
          git commit -m 'Import game music and welcome audio assets'
          git push origin HEAD:agent/music-routing-v27
