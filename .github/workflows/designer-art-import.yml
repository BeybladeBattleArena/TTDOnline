name: Designer Art Import

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: ttd-designer-art-import
  cancel-in-progress: true

jobs:
  import-art:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[asset-import]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to designer asset handoff
        id: gcp_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ttd-online-b8c0f
          workload_identity_provider: projects/761371312112/locations/global/workloadIdentityPools/github-actions/providers/ttd-online
          service_account: github-firebase-deployer@ttd-online-b8c0f.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/drive.readonly

      - name: Materialize lossless PNG masters
        env:
          DRIVE_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          bash scripts/materialize-highres-art-v33.sh
          git add \
            assets/ui/loading-endless-horde.png assets/ui/loading-al-hata.png \
            assets/items/key-normal.png assets/items/key-hard.png assets/items/key-hell.png \
            assets/items/chest-frozen-island-normal.png assets/items/chest-frozen-island-hard.png assets/items/chest-frozen-island-hell.png \
            assets/items/mystery-chest.png assets/items/epic-summon-ticket.png assets/items/exp-tome.png \
            assets/items/ore-common.png assets/items/ore-rare.png assets/items/ore-unique.png assets/items/ore-legendary.png assets/items/ore-omni.png \
            assets/items/gift-box-pink.png assets/items/gift-box-icy.png .github/highres-art-v34.lock
          if git diff --cached --quiet; then
            echo 'PNG masters already match the approved handoff.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[skip ci] [asset-import-record] Lossless PNG designer masters v34'
          git push origin HEAD:main
